<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeerDeutsch | Portal Berita & Belajar</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --card-bg: #252525; --primary: #8b5cf6; --text-main: #e2e8f0; --text-muted: #94a3b8; --border: #333333; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text-main); line-height: 1.6; }

        /* Top Bar */
        .top-bar { background-color: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-title { font-weight: 700; font-size: 1.1rem; color: #fff; display: flex; align-items: center; gap: 6px; }
        .logo-title span { background: var(--primary); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
        .back-btn { background: none; border: none; color: #38bdf8; font-weight: 600; cursor: pointer; font-size: 0.95rem; display: none; }

        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background-color: var(--surface); border-right: 1px solid var(--border); z-index: 2000; transition: left 0.3s ease; padding: 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        .sidebar.active { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .sidebar-close { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-weight: 500; padding: 10px 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background 0.2s; }
        .nav-links a:hover { background-color: rgba(139, 92, 246, 0.2); color: var(--primary); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1500; display: none; }
        .overlay.active { display: block; }

        /* Container & Feed */
        .container { max-width: 800px; margin: 20px auto; padding: 0 16px; }
        .news-card { background-color: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; cursor: pointer; transition: border-color 0.2s; }
        .news-card:hover { border-color: var(--primary); }
        .news-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 0.75rem; }
        .badge-level { background: #7c3aed; color: white; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        .badge-time { background: #334155; color: #cbd5e1; padding: 2px 6px; border-radius: 4px; }
        .news-title { font-size: 1.15rem; font-weight: 700; color: #fff; }

        /* Detail Article View */
        .article-view { display: none; background: var(--surface); border-radius: 12px; padding: 24px; border: 1px solid var(--border); }
        .article-view.active { display: block; }
        
        /* Toggle Switch for Translation */
        .translate-control { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border); }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: cursor; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Paragraph & Translation Blocks */
        .sentence-block { margin-bottom: 16px; }
        .de-text { font-size: 1.05rem; color: #f1f5f9; margin-bottom: 4px; }
        .id-translation { 
            font-size: 0.9rem; 
            color: #d97706; 
            background: rgba(217, 119, 6, 0.1); 
            border-left: 3px solid #d97706; 
            padding: 6px 10px; 
            border-radius: 4px; 
            display: none; /* Sembunyikan secara default */
            margin-top: 4px;
        }
        .id-translation.show { display: block; }

        footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 40px; background: var(--surface); }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <button class="menu-toggle" id="menuBtn" onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">☰</button>
            <button class="back-btn" id="backBtn" onclick="backToFeed()">← Kembali</button>
        </div>
        <div class="logo-title">LeerDeutsch <span>PRO</span></div>
        <div style="width: 24px;"></div>
    </div>

    <!-- Sidebar Menu -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Menu Utama</h3>
            <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
        </div>
        <ul class="nav-links">
            <li><a onclick="toggleSidebar(); backToFeed();">📰 Beranda & Artikel</a></li>
            <li><a href="https://translate.google.com/?sl=de&tl=id" target="_blank">🔍 Kamus Google Translate</a></li>
            <li><a onclick="toggleSidebar(); alert('LeerDeutsch PRO v2.0 - Dibuat oleh Leer');">👤 Tentang Pembuat</a></li>
        </ul>
    </div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- FEED LIST (Hanya Judul & Level) -->
        <div id="feedList">
            <h2 style="margin-bottom: 15px; font-size: 1.2rem; color: var(--text-muted);">Daftar Artikel & Berita Terbaru</h2>
            
            <div class="news-card" onclick="openArticle('artikel1')">
                <div class="news-meta">
                    <span class="badge-level">A1</span>
                    <span class="badge-time">1 minutes</span>
                </div>
                <div class="news-title">Kapitel 2: Ein gemeiner Trick am Teich</div>
            </div>

            <div class="news-card" onclick="openArticle('artikel2')">
                <div class="news-meta">
                    <span class="badge-level" style="background:#2563eb;">B1</span>
                    <span class="badge-time">2 minutes</span>
                </div>
                <div class="news-title">Warum ist Deutschlernen lohnenswert?</div>
            </div>
        </div>

        <!-- DETAIL ARTICLE VIEW (Tampil saat judul diklik) -->
        <div id="articleView" class="article-view">
            <h2 id="articleTitle" style="color: #38bdf8; margin-bottom: 15px; font-size: 1.4rem;"></h2>
            
            <!-- Suggested Translation Toggle Bar -->
            <div class="translate-control">
                <span style="font-weight: 600; font-size: 0.95rem;">Suggested translation</span>
                <label class="switch">
                    <input type="checkbox" id="translateToggle" onchange="toggleTranslation(this)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Konten Kalimat Bahasa Jerman & Terjemahan Otomatis -->
            <div id="articleContent">
                <!-- Diisi via JavaScript -->
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 LeerDeutsch PRO</p>
    </footer>

    <script>
        // Data Artikel dan Terjemahan per kalimat
        const databaseArtikel = {
            'artikel1': {
                title: 'Kapitel 2: Ein gemeiner Trick am Teich',
                sentences: [
                    { de: "Und tatsächlich begann sich Tẩms Leben am nächsten Morgen zu verändern.", id: "Dan sungguh, kehidupan Tắm mulai berubah keesokan paginya." },
                    { de: "Gemeinsam mit Cám ging sie zum Teich.", id: "Bersama dengan Cám, dia pergi ke kolam." },
                    { de: "Ihre Stiefmutter hatte gesagt: „Wer mehr Fische fängt, bekommt ein rotes Kleid.“", id: \"Ibu tirinya telah berkata: \"Siapa pun yang menangkap lebih banyak ikan akan mendapatkan gaun merah.\" " },
                    { de: "Tắm arbeitete fleißig und bald war ihr Korb fast voll.", id: "Tắm bekerja dengan rajin dan segera keranjangnya hampir penuh." }
                ]
            },
            'artikel2': {
                title: 'Warum ist Deutschlernen lohnenswert?',
                sentences: [
                    { de: "Viele Menschen fragen sich, warum man heute noch Deutsch lernen sollte.", id: "Banyak orang bertanya-tanya mengapa seseorang harus belajar bahasa Jerman hari ini." },
                    { de: "Die Antwort ist einfach: Deutsch ist die Sprache von Denkern und Dichtern.", id: "Jawabannya sederhana: Bahasa Jerman adalah bahasa para pemikir dan penyair." },
                    { de: "Durch das Erlernen öffnen sich neue Türen in Technik und Wissenschaft.", id: "Dengan mempelajarinya, pintu-pintu baru terbuka di bidang teknik dan sains." }
                ]
            }
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function openArticle(id) {
            const art = databaseArtikel[id];
            document.getElementById('articleTitle').innerText = art.title;
            
            let contentHTML = '';
            art.sentences.forEach(s => {
                contentHTML += `
                    <div class="sentence-block">
                        <div class="de-text">${s.de}</div>
                        <div class="id-translation">${s.id}</div>
                    </div>
                `;
            });

            document.getElementById('articleContent').innerHTML = contentHTML;
            document.getElementById('translateToggle').checked = false; // Reset toggle

            // Ubah tampilan halaman
            document.getElementById('feedList').style.display = 'none';
            document.getElementById('articleView').classList.add('active');
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('menuBtn').style.display = 'none';
            window.scrollTo(0,0);
        }

        function backToFeed() {
            document.getElementById('feedList').style.display = 'block';
            document.getElementById('articleView').classList.remove('active');
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('menuBtn').style.display = 'block';
        }

        function toggleTranslation(checkbox) {
            const translations = document.querySelectorAll('.id-translation');
            translations.forEach(el => {
                if (checkbox.checked) {
                    el.classList.add('show');
                } else {
                    el.classList.remove('show');
                }
            });
        }
    </script>
</body>
</html>
