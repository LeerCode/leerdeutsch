<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeerDeutsch PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #8b5cf6; --text: #e2e8f0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; }
        
        .top-bar { background: var(--surface); padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 1000; }
        .menu-toggle { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; margin-right: 15px; }
        
        /* Menu Sidebar */
        .sidebar { position: fixed; top: 0; left: -280px; width: 250px; height: 100%; background: var(--surface); z-index: 2000; transition: 0.3s; padding: 20px; }
        .sidebar.active { left: 0; }
        .nav-link { display: block; padding: 15px; color: white; text-decoration: none; border-bottom: 1px solid #333; cursor: pointer; }

        /* Page Content */
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        .card { background: var(--surface); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        h2 { color: var(--primary); margin-bottom: 15px; }
        iframe { width: 100%; height: 500px; border: none; border-radius: 8px; background: white; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <strong>LeerDeutsch PRO</strong>
    </div>

    <div class="sidebar" id="sidebar">
        <h3 style="margin-bottom:20px">Menu Utama</h3>
        <div class="nav-link" onclick="showPage('berita')">📰 Berita & Artikel</div>
        <div class="nav-link" onclick="showPage('kamus')">🔍 Kamus & Penerjemah</div>
        <div class="nav-link" onclick="showPage('tentang')">👤 Tentang Pembuat</div>
        <div class="nav-link" onclick="toggleSidebar()">✕ Tutup</div>
    </div>

    <!-- Page: Berita & Artikel -->
    <div id="berita" class="page active">
        <div class="card">
            <h2>📰 Berita & Artikel</h2>
            <iframe src="https://www.nachrichtenleicht.de/"></iframe>
        </div>
    </div>

    <!-- Page: Kamus -->
    <div id="kamus" class="page">
        <div class="card">
            <h2>🔍 Kamus & Penerjemah</h2>
            <input type="text" id="wordInput" placeholder="Ketik kata Jerman..." style="width:100%; padding:10px; border-radius:6px; margin-bottom:10px;">
            <button onclick="terjemahkan()" style="width:100%; padding:10px; background:var(--primary); color:white; border:none; border-radius:6px;">Buka Google Translate</button>
        </div>
    </div>

    <!-- Page: Tentang -->
    <div id="tentang" class="page">
        <div class="card">
            <h2>👤 Tentang Pembuat</h2>
            <p>Dibuat oleh <strong>Leer</strong> untuk mempermudah belajar bahasa Jerman dengan efisien.</p>
        </div>
    </div>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            toggleSidebar();
        }
        function terjemahkan() {
            const val = document.getElementById('wordInput').value;
            window.open('https://translate.google.com/?sl=de&tl=id&text=' + val, '_blank');
        }
    </script>
</body>
</html>
