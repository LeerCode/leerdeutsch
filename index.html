<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeerDeutsch | Portal Belajar Jerman</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #8b5cf6; --text: #e2e8f0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; }
        .header { background: var(--surface); padding: 15px; text-align: center; font-weight: 700; border-bottom: 1px solid #333; }
        .container { padding: 15px; }
        .news-card { background: var(--surface); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        h2 { font-size: 1.2rem; margin-bottom: 10px; color: var(--primary); }
        /* Iframe untuk menampilkan web lain di dalam web kita */
        .news-frame { width: 100%; height: 600px; border: none; border-radius: 8px; background: white; }
        .translator { background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #000; color: white; margin-bottom: 10px; }
        button { width: 100%; padding: 10px; background: var(--primary); border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">LeerDeutsch PRO</div>
    <div class="container">
        <!-- Translator -->
        <div class="translator">
            <h2>🔍 Penerjemah Cepat</h2>
            <input type="text" id="wordInput" placeholder="Ketik kata Jerman...">
            <button onclick="terjemahkan()">Cari di Google Translate</button>
        </div>

        <!-- Jendela Berita Otomatis -->
        <div class="news-card">
            <h2>📰 Berita Jerman Terbaru (Nachrichtenleicht)</h2>
            <iframe src="https://www.nachrichtenleicht.de/" class="news-frame"></iframe>
        </div>
        
        <div class="news-card">
            <h2>🎧 Berita Audio (Deutsche Welle)</h2>
            <iframe src="https://learngerman.dw.com/de/overview" class="news-frame"></iframe>
        </div>
    </div>
    <script>
        function terjemahkan() {
            const val = document.getElementById("wordInput").value;
            window.open(`https://translate.google.com/?sl=de&tl=id&text=${val}`, '_blank');
        }
    </script>
</body>
</html>
